[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Oude JouwWeb-adressen blijven werken
[[redirects]]
  from = "/backgrount"
  to = "/over"
  status = 301

[[redirects]]
  from = "/contact-formulier"
  to = "/contact"
  status = 301

# Tot livegang: niet indexeren (ook previews)
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
